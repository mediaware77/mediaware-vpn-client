name: Build

# Builds unsigned installers for Linux (.deb) and Windows (.msi).
# macOS is not built: the 2.x client connects through a Network Extension, which needs an Apple
# Developer account with that entitlement.

on:
  push:
    branches: [mediaware, codex/pmcg-vpn]
    tags: ["v*"]
  pull_request:
    branches: [codex/pmcg-vpn]
  workflow_dispatch:

env:
  SQLX_OFFLINE: "1"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev \
            protobuf-compiler libprotobuf-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: new-ui/.nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11
      - name: Build UI
        working-directory: new-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Test core settings and enrollment
        working-directory: src-tauri
        run: |
          cargo test -p defguard-client-core app_config::tests
          cargo test -p defguard-client-core auto_connect::tests
          cargo test -p defguard-client-core enrollment::tests

      - name: Build service and CLI
        working-directory: src-tauri
        run: cargo build --release -p defguard-client-service -p defguard-dg

      - name: Build .deb
        working-directory: src-tauri
        run: cargo tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: pmcg-vpn-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: new-ui/.nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11
      - name: Build UI
        working-directory: new-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Test Windows startup registration
        working-directory: src-tauri
        run: |
          cargo test -p defguard-client-core app_config::tests
          cargo test -p defguard-client --lib windows_startup::tests

      - name: Build service
        working-directory: src-tauri
        run: cargo build --release -p defguard-client-service

      - name: Build .msi
        working-directory: src-tauri
        run: cargo tauri build --bundles msi

      - uses: actions/upload-artifact@v4
        with:
          name: pmcg-vpn-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
